services:
  - type: web
    name: lawpilot
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn legal_management.wsgi:application"
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.0"
    disk:
      name: media-storage
      mountPath: /opt/render/project/src/media
      sizeGB: 1
